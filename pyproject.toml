[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pairgate3d"
version = "1.0.0"
description = "Score-independent geometric gating for online 3D multi-object tracking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "PyYAML>=6", "easydict>=1.10", "torch>=2.2", "tqdm>=4.65", "opencv-python>=4.8", "pyquaternion>=0.9.9"]

[project.optional-dependencies]
transfer = ["numpy<2", "nuscenes-devkit>=1.1.11,<1.3", "pyquaternion>=0.9.9"]
figures = ["pandas>=1.5", "matplotlib>=3.7"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["veloode_mot*"]

[tool.pytest.ini_options]
testpaths = ["experiments/hceg_ablation_suite_20261013/test_ablation_gate.py"]
