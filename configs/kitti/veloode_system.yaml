dataset_path: data/KITTI/tracking/training
detections_path: data/detections/casa/training
save_path: evaluation/results/public/kitti/veloode_system/data
tracking_seqs: [1, 6, 8, 10, 12, 13, 14, 15, 16, 18, 19]
tracking_type: Car
motion_model: ODE
state_func_covariance: 100
measure_func_covariance: 0.001
prediction_score_decay: 0.03
LiDAR_scanning_frequency: 10
max_prediction_num: 5
max_prediction_num_for_new_object: 3
input_score: -1.5
init_score: 1.6
update_score: 0.5
post_score: 0
min_track_score: 0.0
latency: 0
causal_output: true
use_sensor_depth: true
use_last_detection_velocity: true
min_update_delta_v: 0.3
ema_alpha: 0.3
ema_size_scale: 1.3
size_trust_thresh: 5.0
size_blend_alpha: 0.5
vel_reg_weight: 0.0
deadzone_conf_scale: 0.0
write_provenance: true
frame_ids_from_detections: true
fixed_max_miss: true
prediction_emit_cap: 1
eligible_association: true
association_actual_gap_velocity: true
motion_observer_mode: robust_history
motion_history_window: 4
motion_history_min_samples: 3
deployed_trapezoidal_helper: true
cv_gap_prediction: false
association_lambda_vel: 0.0
adaptive_prediction_fusion: true
adaptive_fusion_min_updates: 4
adaptive_fusion_min_legitimacy: 0.7
adaptive_fusion_residual_threshold: 2.0
adaptive_fusion_cv_blend: 0.5
